<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d35e"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background / Ground Shadow -->
  <ellipse cx="400" cy="530" rx="300" ry="25" fill="rgba(0,0,0,0.1)"/>

  <!-- BICYCLE (Back Layer) -->
  <g id="bicycle">
    <!-- Rear Wheel -->
    <g id="rear-wheel">
      <circle cx="220" cy="450" r="80" stroke="#264653" stroke-width="12" fill="none"/>
      <circle cx="220" cy="450" r="72" stroke="#e9c46a" stroke-width="4" fill="none"/>
      <!-- Spokes -->
      <g stroke="#ccc" stroke-width="2">
        <line x1="220" y1="370" x2="220" y2="530"/>
        <line x1="140" y1="450" x2="300" y2="450"/>
        <line x1="163" y1="393" x2="277" y2="507"/>
        <line x1="163" y1="507" x2="277" y2="393"/>
        <line x1="193" y1="377" x2="247" y2="523"/>
        <line x1="193" y1="523" x2="247" y2="377"/>
        <line x1="147" y1="420" x2="293" y2="480"/>
        <line x1="147" y1="480" x2="293" y2="420"/>
      </g>
      <!-- Hub -->
      <circle cx="220" cy="450" r="12" fill="#264653"/>
      <circle cx="220" cy="450" r="6" fill="#e9c46a"/>
    </g>

    <!-- Front Wheel -->
    <g id="front-wheel">
      <circle cx="580" cy="450" r="80" stroke="#264653" stroke-width="12" fill="none"/>
      <circle cx="580" cy="450" r="72" stroke="#e9c46a" stroke-width="4" fill="none"/>
      <!-- Spokes -->
      <g stroke="#ccc" stroke-width="2">
        <line x1="580" y1="370" x2="580" y2="530"/>
        <line x1="500" y1="450" x2="660" y2="450"/>
        <line x1="523" y1="393" x2="637" y2="507"/>
        <line x1="523" y1="507" x2="637" y2="393"/>
        <line x1="553" y1="377" x2="607" y2="523"/>
        <line x1="553" y1="523" x2="607" y2="377"/>
        <line x1="507" y1="420" x2="653" y2="480"/>
        <line x1="507" y1="480" x2="653" y2="420"/>
      </g>
      <!-- Hub -->
      <circle cx="580" cy="450" r="12" fill="#264653"/>
      <circle cx="580" cy="450" r="6" fill="#e9c46a"/>
    </g>

    <!-- Frame -->
    <g id="frame" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Chainstay -->
      <line x1="220" y1="450" x2="350" y2="450"/>
      <!-- Seatstay -->
      <line x1="220" y1="450" x2="320" y2="320"/>
      <!-- Seat tube -->
      <line x1="350" y1="450" x2="320" y2="320"/>
      <!-- Top tube -->
      <line x1="320" y1="320" x2="520" y2="300"/>
      <!-- Down tube -->
      <line x1="350" y1="450" x2="520" y2="300"/>
      <!-- Head tube -->
      <line x1="520" y1="300" x2="540" y2="380"/>
      <!-- Fork -->
      <line x1="540" y1="380" x2="580" y2="450"/>
      <!-- Handlebar stem -->
      <line x1="520" y1="300" x2="540" y2="270"/>
    </g>

    <!-- Handlebars -->
    <path d="M 540 270 Q 580 260 570 300" stroke="#264653" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Seat -->
    <path d="M 290 320 L 340 320 Q 350 310 340 300 L 290 300 Q 280 310 290 320 Z" fill="#264653"/>
    <path d="M 310 320 L 315 340" stroke="#264653" stroke-width="6"/>

    <!-- Drivetrain -->
    <g id="drivetrain">
      <!-- Chainring -->
      <circle cx="350" cy="450" r="25" stroke="#264653" stroke-width="6" fill="#e9c46a"/>
      <circle cx="350" cy="450" r="15" stroke="#264653" stroke-width="4" fill="none"/>
      <!-- Crank arms -->
      <line x1="350" y1="450" x2="330" y2="470" stroke="#264653" stroke-width="8" stroke-linecap="round"/>
      <line x1="350" y1="450" x2="370" y2="430" stroke="#264653" stroke-width="8" stroke-linecap="round"/>
      <!-- Pedals -->
      <rect x="315" y="465" width="30" height="10" rx="3" fill="#264653"/>
      <rect x="355" y="425" width="30" height="10" rx="3" fill="#264653"/>
    </g>
  </g>

  <!-- PELICAN (Back Leg and Wing) -->
  <g id="pelican-back">
    <!-- Left Leg -->
    <path d="M 340 280 L 350 430 L 370 430" stroke="#e76f51" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Left Foot -->
    <path d="M 370 430 L 390 420 L 395 435 L 375 440 Z" fill="#e76f51"/>
  </g>

  <!-- PELICAN (Body and Head) -->
  <g id="pelican-body" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="360" cy="230" rx="85" ry="65" fill="url(#bodyGrad)"/>
    <!-- Tail feathers -->
    <path d="M 280 220 Q 230 190 220 220 Q 240 240 270 250 Z" fill="#f1faee"/>
    <path d="M 285 240 Q 240 230 230 260 Q 250 270 280 260 Z" fill="#e0e0e0"/>
    
    <!-- Neck -->
    <path d="M 400 195 C 450 180 430 120 460 100 L 410 90 C 380 130 380 180 340 200 Z" fill="url(#bodyGrad)"/>
    
    <!-- Head -->
    <circle cx="450" cy="100" r="35" fill="url(#bodyGrad)"/>
    
    <!-- Beak (Upper) -->
    <path d="M 480 90 Q 620 60 670 100 Q 600 115 480 115 Z" fill="url(#beakGrad)"/>
    <!-- Beak (Lower/Pouch) -->
    <path d="M 480 115 Q 590 130 650 100 Q 600 180 480 150 Z" fill="url(#pouchGrad)"/>
    
    <!-- Fish in Pouch -->
    <g id="fish">
      <path d="M 570 140 Q 590 120 610 140 Q 590 160 570 140 Z" fill="#457b9d"/>
      <path d="M 610 140 L 625 130 L 620 145 L 625 160 Z" fill="#457b9d"/>
      <circle cx="585" cy="135" r="3" fill="#1d3557"/>
    </g>

    <!-- Eye -->
    <circle cx="460" cy="90" r="6" fill="#1d3557"/>
    <circle cx="462" cy="88" r="2" fill="#fff"/>
    
    <!-- Helmet -->
    <path d="M 420 75 Q 440 40 475 70 Q 480 85 460 85 Q 440 90 420 85 Z" fill="#e63946"/>
    <path d="M 420 85 L 435 110" stroke="#264653" stroke-width="3" fill="none"/>
    <!-- Helmet strap -->
    <path d="M 455 85 L 455 115" stroke="#264653" stroke-width="3" fill="none"/>
  </g>

  <!-- PELICAN (Front Leg and Wing) -->
  <g id="pelican-front">
    <!-- Right Leg -->
    <path d="M 370 280 L 370 450 L 390 450" stroke="#f4a261" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Right Foot (on pedal) -->
    <path d="M 390 450 L 415 440 L 420 455 L 395 460 Z" fill="#f4a261"/>
    
    <!-- Right Wing (gripping handlebars) -->
    <path d="M 380 200 C 460 220 520 240 550 280 L 530 300 C 480 270 430 260 360 240 Z" fill="#f1faee" stroke="#ccc" stroke-width="2"/>
    <!-- Wing feathers -->
    <path d="M 450 245 Q 480 260 520 285" stroke="#ccc" stroke-width="2" fill="none"/>
    <path d="M 430 235 Q 460 250 500 275" stroke="#ccc" stroke-width="2" fill="none"/>
    <path d="M 410 225 Q 440 240 480 265" stroke="#ccc" stroke-width="2" fill="none"/>
    
    <!-- Wing "Hand" wrapping handlebar -->
    <path d="M 530 300 Q 560 290 560 310" stroke="#f1faee" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bicycle Bell -->
  <g id="bell" transform="translate(560, 280)">
    <circle cx="0" cy="0" r="8" fill="#e9c46a" stroke="#264653" stroke-width="2"/>
    <circle cx="-3" cy="-3" r="2" fill="#fff"/>
  </g>

  <!-- Motion Lines (optional, for a sense of riding) -->
  <g stroke="#ccc" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="420" x2="140" y2="420"/>
    <line x1="80" y1="450" x2="150" y2="450"/>
    <line x1="110" y1="480" x2="160" y2="480"/>
  </g>
</svg>
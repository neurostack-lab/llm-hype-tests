<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e8f4fb"/>
  <rect y="240" width="400" height="60" fill="#c9d9a8"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="110" cy="220" r="45"/>
    <circle cx="290" cy="220" r="45"/>
    <!-- Spokes -->
    <g stroke-width="1.5" stroke="#777">
      <line x1="110" y1="175" x2="110" y2="265"/>
      <line x1="65" y1="220" x2="155" y2="220"/>
      <line x1="78" y1="188" x2="142" y2="252"/>
      <line x1="142" y1="188" x2="78" y2="252"/>
      <line x1="290" y1="175" x2="290" y2="265"/>
      <line x1="245" y1="220" x2="335" y2="220"/>
      <line x1="258" y1="188" x2="322" y2="252"/>
      <line x1="322" y1="188" x2="258" y2="252"/>
    </g>
    <!-- Frame -->
    <g stroke="#c0392b" stroke-width="6">
      <line x1="110" y1="220" x2="180" y2="220"/>
      <line x1="180" y1="220" x2="160" y2="150"/>
      <line x1="110" y1="220" x2="160" y2="150"/>
      <line x1="160" y1="150" x2="265" y2="150"/>
      <line x1="180" y1="220" x2="265" y2="150"/>
      <line x1="265" y1="150" x2="290" y2="220"/>
      <line x1="265" y1="150" x2="258" y2="125"/>
    </g>
    <!-- Handlebar -->
    <path d="M245 122 L270 122 Q282 124 280 136" stroke-width="5"/>
    <!-- Seat -->
    <path d="M145 145 L175 145" stroke-width="7"/>
    <line x1="160" y1="150" x2="160" y2="145"/>
    <!-- Crank & pedals -->
    <circle cx="180" cy="220" r="8" fill="#333"/>
    <line x1="180" y1="220" x2="195" y2="205"/>
    <line x1="180" y1="220" x2="165" y2="235"/>
    <line x1="188" y1="205" x2="202" y2="205" stroke-width="5"/>
    <line x1="158" y1="235" x2="172" y2="235" stroke-width="5"/>
  </g>

  <!-- Pelican legs -->
  <g stroke="#e67e22" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M165 140 L185 175 L195 205"/>
    <path d="M160 142 L150 190 L165 235"/>
  </g>
  <!-- Feet -->
  <path d="M188 205 L205 203 L200 209 Z" fill="#e67e22"/>
  <path d="M158 235 L175 233 L170 239 Z" fill="#e67e22"/>

  <!-- Pelican body -->
  <ellipse cx="170" cy="115" rx="50" ry="32" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Tail -->
  <path d="M122 108 L100 98 L106 115 L98 125 L124 122 Z" fill="#f2f2f2" stroke="#999" stroke-width="2"/>
  <!-- Wing -->
  <path d="M145 105 Q180 90 205 110 Q190 135 150 128 Z" fill="#dcdcdc" stroke="#888" stroke-width="2"/>
  <path d="M160 125 Q175 130 190 124" stroke="#555" stroke-width="2" fill="none"/>
  <!-- Wing reaching to handlebar -->
  <path d="M200 112 Q230 115 255 122" stroke="#dcdcdc" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M200 112 Q230 115 255 122" stroke="#888" stroke-width="1.5" fill="none"/>

  <!-- Neck -->
  <path d="M200 100 Q225 80 215 55 Q210 40 222 32" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M208 108 Q233 82 223 55" stroke="#999" stroke-width="1.5" fill="none"/>

  <!-- Head -->
  <circle cx="225" cy="35" r="15" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <!-- Crest -->
  <path d="M220 21 Q215 12 225 14 Q222 18 228 20" fill="#f5e6a8" stroke="#999" stroke-width="1"/>
  <!-- Eye -->
  <circle cx="229" cy="32" r="3" fill="#222"/>
  <circle cx="230" cy="31" r="1" fill="#fff"/>

  <!-- Beak (upper) -->
  <path d="M236 32 L310 48 L238 42 Z" fill="#f1c40f" stroke="#d4a017" stroke-width="1.5"/>
  <!-- Pouch -->
  <path d="M238 42 L310 48 Q290 75 255 68 Q240 60 236 45 Z" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
  <!-- Beak tip -->
  <path d="M306 46 L314 49 L306 51 Z" fill="#e67e22"/>

  <!-- Motion lines -->
  <g stroke="#9bb" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="190" x2="55" y2="190"/>
    <line x1="20" y1="210" x2="50" y2="210"/>
    <line x1="35" y1="230" x2="58" y2="230"/>
  </g>
</svg>